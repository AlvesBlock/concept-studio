[build]
  command = "npm run build -- --output-mode=static"
  publish = "dist/concept-studio/browser"

[build.environment]
  NODE_VERSION = "24.15.0"

[[redirects]]
  from = "/"
  to = "/editor"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
